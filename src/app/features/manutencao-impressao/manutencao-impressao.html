<div class="form-box">
  <h2>
    @if(id !== null) {
    Editar Impressão
    } @else {
    Adicionar Impressão
    }
  </h2>

  @if(carregando) {
  <div class="info-message">
    Carregando impressão
  </div>
  }

  @if(successMessage) {
  <div class="success-message">
    {{ successMessage }}
  </div>
  }

  @if(erro) {
  <div class="error-message">
    {{ erro }}
  </div>
  }


  <form [formGroup]="form" (ngSubmit)="submit()">

    <div class="field">
      <label for="nomeProjeto">nome projeto</label>
      <input id="nomeProjeto" formControlName="nomeProjeto" />

      <span class="character-count">
        {{ form.controls.nomeProjeto.value.length }} caracteres
      </span>
    </div>

    <div class="field">
      <label for="material">material</label>
      <select id="material" formControlName="material">
        <option value="PLA">PLA</option>
        <option value="ABS">ABS</option>
        <option value="PETG">PETG</option>
      </select>
    </div>

    <div class="field">
      <label for="pesoGramas">peso em gramas</label>
      <input id="pesoGramas" type="number" formControlName="pesoGramas" />
    </div>

    <div class="field">
      <label for="duracaoHoras">duração em horas</label>
      <input id="duracaoHoras" type="number" formControlName="duracaoHoras" />
    </div>

    <div class="field">
      <label for="solicitante">solicitante</label>
      <input id="solicitante" formControlName="solicitante" />
    </div>

    <!-- NOVO: campo de data já previsto no FormGroup do TypeScript. -->
    <div class="field">
      <label for="dataSolicitacao">data da solicitação</label>
      <input id="dataSolicitacao" type="date" formControlName="dataSolicitacao" />
    </div>

    <div class="field">
      <label for="concluida">concluída</label>
      <input id="concluida" type="checkbox" formControlName="concluida" />
    </div>

    <!-- NOVO: botão que executa o método submit() do TypeScript. -->
    <div class="form-buttons">
      <button type="submit" [disabled]="salvando || carregando">
        {{ salvando ? 'Salvando...' : 'Salvar impressão' }}
      </button>

      <!-- NOVO: link para voltar à administração sem salvar. -->
      <a routerLink="/admin">Cancelar</a>
    </div>

  </form>
</div>
